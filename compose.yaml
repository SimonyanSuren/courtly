# Local development: PostgreSQL for `npm run start:dev`. The tests start their own.
#
#   docker compose up -d --wait postgres   start PostgreSQL on 127.0.0.1:5432
#   docker compose down                    stop it, keeping the data
#   docker compose down -v                 stop it and delete the data
#
# Ports bind to 127.0.0.1: Docker publishes on all interfaces by default, and its NAT rules
# bypass host firewalls such as ufw. Credentials are local-only and match apps/api/.env.example.

name: courtly

services:
  postgres:
    # Debian (glibc) rather than Alpine (musl): text collation then matches hosted PostgreSQL,
    # so ORDER BY on names behaves the same here, in CI and in production.
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports: ['127.0.0.1:5432:5432']
    # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/, so the volume mounts
    # the parent.
    volumes: [postgres-data:/var/lib/postgresql]
    # Docker's default 64 MB /dev/shm is too small for parallel query workers.
    shm_size: 128mb
    healthcheck:
      # TCP, not the default Unix socket: on first start the entrypoint runs a temporary
      # socket-only server for initdb, and a socket check would report it as ready.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'courtly', '-d', 'courtly']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  postgres-data:
