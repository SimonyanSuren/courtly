# Courtly from a fresh clone, with only Docker: PostgreSQL, then the migrations, then the API,
# then the web app.
#
#   docker compose up                      build and start everything; Ctrl+C stops it
#   docker compose up -d --wait            the same in the background, until all are healthy
#   docker compose up -d --wait postgres   only PostgreSQL, for `npm run start:dev`
#   docker compose down                    stop everything, keeping the data
#   docker compose down -v                 stop everything and delete the data
#
# The app is at http://localhost:8080 and calls the API under /api on that origin. The API also
# answers directly on http://127.0.0.1:3000/api; GET /api/health checks it and its database. The
# tests start their own PostgreSQL.
# Ports bind to 127.0.0.1: Docker publishes on all interfaces by default, and its NAT rules
# bypass host firewalls such as ufw. Credentials are local-only and match apps/api/.env.example.

name: courtly

# Shared by every service that runs the API image: the API and its one-off jobs.
x-api: &api
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: courtly-api
  # Rebuild on every `up`, so it runs the code that is checked out; unchanged layers come from
  # the build cache. The default would reuse an image built from older code.
  pull_policy: build
  environment:
    PORT: 3000
    DATABASE_URL: postgres://courtly:courtly@postgres:5432/courtly
    # The demo is served over plain HTTP on localhost, where a Secure cookie would not be kept.
    SESSION_COOKIE_SECURE: 'false'
    # nginx in front sets X-Forwarded-For to the client's address. Port 3000 also reaches the API
    # without nginx, but only from this machine, whose processes could send any header anyway.
    TRUST_PROXY_HOPS: 1
  # Hardening a production runtime should also apply. The API writes nothing to disk, so the
  # filesystem is read-only; /tmp stays writable, in memory, for libraries that need scratch files.
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    # Debian (glibc) rather than Alpine (musl): text collation then matches hosted PostgreSQL,
    # so ORDER BY on names behaves the same here, in CI and in production.
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports: ['127.0.0.1:5432:5432']
    # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/, so the volume mounts
    # the parent.
    volumes: [postgres-data:/var/lib/postgresql]
    # Docker's default 64 MB /dev/shm is too small for parallel query workers.
    shm_size: 128mb
    healthcheck:
      # TCP, not the default Unix socket: on first start the entrypoint runs a temporary
      # socket-only server for initdb, and a socket check would report it as ready.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'courtly', '-d', 'courtly']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Applies pending migrations, then exits. Applied ones are recorded in the database, so a rerun
  # changes nothing.
  migrate:
    <<: *api
    command: [node, --enable-source-maps, dist/migrate.js]
    # A one-off job, not a server: the image's HTTP health check does not apply.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully

  # nginx: the built app, with /api/ passed to the API. Its health check comes from the image.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: courtly-web
    # As for the API: rebuild on every `up`, so it serves the code that is checked out.
    pull_policy: build
    ports: ['127.0.0.1:8080:8080']
    # nginx writes only its pid file and the temporary files of large requests and responses,
    # all under /tmp, which stays writable, in memory.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
        # nginx looks up the API's address once, at start. When Compose replaces the API
        # container, which may get a new address, it restarts nginx too; otherwise: 502.
        restart: true

volumes:
  postgres-data:
