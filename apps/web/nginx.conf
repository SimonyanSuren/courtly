# The web app's server. It replaces the image's /etc/nginx/conf.d/default.conf, which the image's
# nginx.conf includes inside its http block. It serves the built files and passes /api/ to the
# API, so the browser sees a single origin: the session cookie stays first-party and no CORS is
# needed.
server {
    listen 8080;
    root /srv/courtly;

    # No nginx version in the Server header or on error pages; clients don't need to know.
    server_tokens off;

    # These headers go on every response, errors included (always). By default, a location with
    # an add_header of its own (Cache-Control below) drops the server's; merge keeps both.
    add_header_inherit merge;
    # Browsers use the declared Content-Type and never guess, so no response runs as a script
    # or a stylesheet it was not served as.
    add_header X-Content-Type-Options nosniff always;
    # Other sites get no Referer. Not no-referrer: browsers would then send "Origin: null" with
    # form posts, which the API's cross-origin check rejects when Sec-Fetch-Site is missing.
    add_header Referrer-Policy same-origin always;
    # Code, styles and API calls come from this origin only, and no site may frame the app.
    # Mantine adds <style> elements at run time for its CSS variables, hence 'unsafe-inline' for
    # styles; a nonce would need a new value per response, which static files cannot carry.
    # Images may also be data: URLs, in which the API reference's stylesheet (Swagger UI, under
    # /api/docs) draws its icons; an image cannot run code.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Not covered by the fallback below: an unknown API path gets the API's 404, not index.html.
    location /api/ {
        proxy_pass http://api:3000;
        # The browser's Host header as sent, port included (localhost:8080). Without
        # Sec-Fetch-Site, the API's cross-origin check compares Origin with Host. nginx would
        # send "api:3000" by default, and $host drops the port, so same-origin posts would get 403.
        proxy_set_header Host $http_host;
        # The address the client connected from, replacing any X-Forwarded-For it sent, so the
        # API's login limit counts clients instead of nginx and cannot be dodged with the header.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Vite puts a hash of each file's content in its name here, so a URL never changes content:
    # browsers keep these files for a year without asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other path that is not a file is a route of the app (/courts, /admin): index.html.
    # no-cache: browsers check with the server on every load (a cheap 304 when unchanged), so a
    # new build reaches them at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control no-cache;
    }
}
